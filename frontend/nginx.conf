pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 16k;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    proxy_hide_header Cache-Control;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    location / { try_files $uri $uri/ /index.html; }
    location /v1/ { proxy_pass http://api:8000; proxy_connect_timeout 3s; proxy_read_timeout 15s; }
    location /health/ { proxy_pass http://api:8000; proxy_connect_timeout 3s; proxy_read_timeout 5s; }
  }
}
