# CI at the repository root (.github/workflows/ci.yml).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks that need no image build: they fail in a minute or two, before the long test job starts.
  # Each tool is pinned: actions by commit, images by digest, Python tools by version.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned by commit (a moved tag changes nothing); the version in the comment, for Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The Python of the Dockerfile, so the same versions resolve.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      # Trailing spaces, conflict markers and CRLF line endings. Recorded logs and sample data stay as captured.
      - name: Whitespace and line endings
        run: |
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD -- . ':!docs/evidencias' ':!samples'
          if git ls-files --eol | grep 'i/crlf' | grep -v -e 'docs/evidencias/' -e 'samples/'; then
            echo "::error::CRLF line endings in the files above: save them with LF"
            exit 1
          fi

      # The ruff of requirements-dev.txt, the one the tests image has (config in pyproject.toml).
      - name: Lint and format (ruff)
        run: |
          python -m pip install --quiet --disable-pip-version-check "$(grep '^ruff==' requirements-dev.txt)"
          ruff check .
          ruff format --check .

      # Functions, classes and imports nothing uses (config in pyproject.toml, [tool.vulture]).
      - name: Dead code (vulture)
        run: |
          python -m pip install --quiet --disable-pip-version-check vulture==2.16
          vulture

      # README and docs/ (config in .markdownlint-cli2.jsonc).
      - name: Markdown (markdownlint)
        run: >
          docker run --rm -v "$PWD:/workdir:ro"
          davidanson/markdownlint-cli2@sha256:9ae6011b3d978315ad283bf2af997ef08687a797b9e55086c94a90bf620f0783

      # The Dockerfile (config in .hadolint.yaml).
      - name: Dockerfile (hadolint)
        run: >
          docker run --rm -v "$PWD:/w:ro" -w /w
          hadolint/hadolint@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e hadolint Dockerfile

      # This workflow and the others in .github/workflows.
      - name: Workflows (actionlint)
        run: >
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color

      # Keys and tokens committed by mistake. A fictitious value that looks like one is marked `gitleaks:allow`.
      - name: Secrets (gitleaks)
        run: >
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks@sha256:2bcceac45179b3a91bff11a824d0fb952585b429e54fc928728b1d4d5c3e5176
          dir /repo --no-banner --redact

      # docker-compose.yml with every profile: services, files and variables it names.
      - name: Compose file
        run: |
          cp .env.example .env
          docker compose --profile cli --profile test config --quiet

      # Known vulnerabilities in the pinned requirements and everything they pull in.
      # pip-audit fails on any vulnerability, and has no flag to skip the ones without a fixed
      # version (--ignore-vuln takes one ID at a time). So it writes JSON, and this step fails only
      # on a vulnerability with `fix_versions` (bump that pin); one with no fix yet, which no pin
      # change could clear, is a warning. --strict: a dependency that could not be audited fails
      # instead of being skipped. A reviewed, not applicable advisory: --ignore-vuln <ID> here.
      # Without the JSON, pip-audit could not install the pins at all (pip's ResolutionImpossible,
      # printed above): a bump that conflicts with another pin, said as such, not as a traceback.
      - name: Audit dependencies (pip-audit)
        run: |
          python -m pip install --quiet --disable-pip-version-check pip-audit==2.10.1
          pip-audit -r requirements.txt -r requirements-dev.txt -r constraints.txt --strict --progress-spinner off \
            --desc off -f json -o pip-audit.json || true
          if [ ! -s pip-audit.json ]; then
            echo "::error::the pinned requirements do not install together (see pip's error above): a version conflict between pins, not a known vulnerability"
            exit 1
          fi
          python - <<'EOF'
          import json
          import sys
          found = sorted({(dep['name'], dep['version'], vuln['id'], ', '.join(vuln['fix_versions']))
                          for dep in json.load(open('pip-audit.json'))['dependencies']
                          for vuln in dep.get('vulns', [])})
          for name, version, vuln_id, fixes in found:
              print(f'::error::{name} {version}: {vuln_id}, fixed in {fixes}' if fixes else
                    f'::warning::{name} {version}: {vuln_id}, no fixed version yet')
          print(f'pip-audit: {len(found)} known vulnerabilities, {sum(bool(f[3]) for f in found)} with a fix')
          sys.exit(any(fixes for *_, fixes in found))
          EOF

  test:
    needs: checks
    runs-on: ubuntu-latest
    # A cold build installs Tesseract and the Python dependencies.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Tests never call Gemini: the example env file has an empty key.
      - name: Prepare env file
        run: cp .env.example .env

      # A throwaway database key for this run (32 random bytes, base64url).
      - name: Generate database key
        run: echo "DB_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> .env

      - name: Build
        run: docker compose --profile cli --profile test build

      # The lean agent image alone runs the CLI (no test tools in it).
      - name: Agent image (transpile)
        run: docker compose run --rm --no-deps agent python -m cli transpile specs/agent.json

      # Type check in the tests service (config in pyproject.toml); no service needed.
      - name: Type check (mypy)
        run: docker compose run --rm --no-deps tests mypy

      # Coverage is reported, not enforced. The image is read-only outside /tmp.
      - name: Tests with coverage
        run: docker compose run --rm -e CI tests pytest -q -n auto --cov --cov-report=term

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop services
        if: always()
        run: docker compose down
