# Opt-in synthetic laboratory. No provider credentials or external egress.
services:
  api:
    environment:
      RAG_RETRIEVAL: extractive_lab
    depends_on:
      qdrant: {condition: service_started}
  worker:
    environment:
      RAG_RETRIEVAL: extractive_lab
    depends_on:
      qdrant: {condition: service_started}
  qdrant:
    image: qdrant/qdrant@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      # Bounded I/O concurrency for preserved legacy collections; not a wider RTO.
      QDRANT__STORAGE__PERFORMANCE__MAX_CONCURRENT_COLLECTION_LOADS: "4"
    volumes: [qdrantdata:/qdrant/storage]
    networks: [data]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1
    logging: {driver: json-file, options: {max-size: 5m, max-file: "3"}}
volumes:
  qdrantdata: {}
