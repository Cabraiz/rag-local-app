# Opt-in, offline model service. Public weights are fetched only by the build helper.
services:
  api:
    environment:
      RAG_EMBEDDING: neural_lab
    depends_on:
      embeddings: {condition: service_healthy}
  worker:
    environment:
      RAG_EMBEDDING: neural_lab
    depends_on:
      embeddings: {condition: service_healthy}
  embeddings:
    image: rag-local-embedding:0.1.0
    build:
      context: ./semantic
      additional_contexts:
        policy: ./src/rag_app
        dataset: ../eval/datasets
    networks: [data]
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 2
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: {driver: json-file, options: {max-size: 5m, max-file: "3"}}
