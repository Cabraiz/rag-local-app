# Optional one-shot read probe. No changes to API/worker/Qdrant/PostgreSQL networks.
services:
  atlassian-probe:
    profiles: [atlassian-lab]
    image: rag-local-mcp-lab:0.1.0
    build: {context: ., dockerfile: infrastructure/images/integrations/Dockerfile.mcp-lab}
    command: [python, -m, rag_app.atlassian_lab]
    user: "10001:10001"
    restart: "no"
    environment:
      RAG_MODE: lab
      RAG_ATLASSIAN_PROBE: synthetic_readonly
      OTEL_SDK_DISABLED: "true"
    secrets: [atlassian_mcp_token]
    networks: [atlassian_egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    pids_limit: 64
    cpus: 0.5
    mem_limit: 384m
    logging: {driver: json-file, options: {max-size: 1m, max-file: "2"}}
networks:
  atlassian_egress: {}
secrets:
  atlassian_mcp_token:
    file: ../.local/secrets/atlassian-mcp-token-replacement.txt
