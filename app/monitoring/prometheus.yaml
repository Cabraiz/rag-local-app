global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: rag-api
    metrics_path: /internal/metrics
    static_configs: [{targets: ['api:8000']}]
  - job_name: rabbitmq
    static_configs: [{targets: ['rabbitmq:15692']}]
